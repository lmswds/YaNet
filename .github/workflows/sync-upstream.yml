name: Sync Upstream

on:
  schedule:
    # 每月1日北京时间 08:00 运行（UTC 00:00）
    - cron: '0 0 1 */3 *'
  workflow_dispatch: # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal branch
        uses: actions/checkout@v4
        with:
          ref: personal
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/dahaha-365/YaNet.git
          git fetch upstream

      # Step 1: 同步 upstream/main → origin/main
      - name: Sync upstream/main into origin/main
        run: |
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      # Step 2: 将 main 合并到 personal 并推送
      # 若有冲突 git merge 返回非零退出码，workflow 自动失败并发邮件通知
      - name: Merge main into personal and push
        run: |
          git checkout personal
          git merge main --no-edit
          git push origin personal
